<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Racing Duel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="duel-game-core.css">
  <link rel="stylesheet" href="style.css">
  <!--
    Sets up window.duelActorReady/duelWsReady synchronously, before either
    the duel-app.js module script below or main.js (this app's own
    bundle, built by esbuild — see package.json's "build" script) runs —
    so both are always there for
    app/modules/gameplay/game-communication/utils/duel-actor.ts to await,
    whichever of the two happens to execute first. See duel/duel-app.js.
  -->
  <script>
    window.duelActorReady = new Promise((resolve) => { window.__resolveDuelActor = resolve; });
    window.duelWsReady = new Promise((resolve) => { window.__resolveDuelWs = resolve; });
  </script>
</head>
<body>
  <!-- duel-game-core's generic chrome: lobby, staging, rematch, busy,
       debrief, session identity — everything that isn't the 3D race
       itself. Driven by duel/duel-app.js. Compact in-game HUD styling for
       this strip lives in style.css (body.in-race). -->
  <header id="duel-header">
    <h1>Racing <span class="sub">— Duel</span></h1>
    <div class="session">
      <button id="leaderboard-toggle" title="Leaderboard" aria-label="Leaderboard">🏆</button>
      <span class="label">Driver ID</span>
      <code id="sid">…</code>
      <button id="new-sid" title="Play as a different driver">new</button>
      <button id="duel-auth-btn"></button>
    </div>
  </header>
  <div id="leaderboard-panel" hidden>
    <div class="leaderboard-header">
      <button id="leaderboard-back" class="ghost">← Back</button>
      <h2>🏆 Best laps</h2>
    </div>
    <div id="leaderboard-body" class="leaderboard-list"><p class="muted">Loading…</p></div>
  </div>
  <div id="bot-challenge-panel" hidden>
    <div class="bot-challenge-header">
      <button id="bot-challenge-back" class="ghost">← Back</button>
      <h2>🤖 Bots</h2>
    </div>
    <div id="bot-challenge-body" class="bot-challenge-body"><p class="muted">Loading…</p></div>
  </div>
  <p id="error" class="error" hidden></p>
  <main id="screen">
    <p class="muted">Connecting to the board…</p>
  </main>
  <div id="bot-add-panel" hidden>
    <button id="bot-add-trigger" class="ghost">Add Bot 🤖 to the open seat</button>
  </div>

  <!-- The 3D race — a full-viewport layer behind #screen, only made
       visible (see body.in-race/body.race-ready in style.css) once a
       game starts; driven independently by main.js (this app's own
       bundle — see main.ts). -->
  <div id="game-stage"></div>
  <!-- In-race HUD (speedometer / minimap / position+time panel), built and
       populated by app/modules/gameplay/game-viewport/hud/hud.ts. Same
       visibility gating as #game-stage (see body.in-race.race-ready in
       style.css). -->
  <div id="hud"></div>
  <!-- Fills the gap between body.in-race (added the moment the poller
       notices #inGame) and body.race-ready (added by main.ts once the
       map and both cars have actually finished loading — see its
       comment) — without this, that window is just the dark page
       background with nothing on it while track/car assets download.
       Shown/hidden purely by CSS (body.in-race:not(.race-ready) in
       style.css); no script drives it. -->
  <div id="loading-overlay">
    <div class="loading-spinner"></div>
    <p>Loading track…</p>
  </div>

  <!-- duel-app.js is esbuild's bundle of src/duel/duel-app.js (see
       build.js) — every dependency it and duel-game-core itself need
       (@icp-sdk/core, @icp-sdk/auth, cborg) is resolved and inlined at
       build time, so no import map or bare-specifier resolution is
       needed here. -->
  <script type="module" src="duel-app.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
