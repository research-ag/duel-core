<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Racing Duel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="duel-game-core.css">
  <link rel="stylesheet" href="style.css">
  <!-- Set up synchronously so duel-app.js and main.js can each await the
       other's result regardless of load order (see duel-actor.ts). -->
  <script>
    window.duelActorReady = new Promise((resolve) => { window.__resolveDuelActor = resolve; });
    window.duelWsReady = new Promise((resolve) => { window.__resolveDuelWs = resolve; });
  </script>
</head>
<body>
  <!-- duel-game-core's generic chrome, driven by duel/duel-app.js. -->
  <header id="duel-header">
    <h1>Racing <span class="sub">— Duel</span></h1>
    <div class="session">
      <button id="leaderboard-toggle" title="Leaderboard" aria-label="Leaderboard">🏆</button>
      <span class="label">Driver ID</span>
      <code id="sid">…</code>
      <button id="new-sid" title="Play as a different driver">new</button>
      <button id="duel-auth-btn"></button>
    </div>
  </header>
  <div id="leaderboard-panel" hidden>
    <div class="leaderboard-header">
      <button id="leaderboard-back" class="ghost">← Back</button>
      <h2>🏆 Best laps</h2>
    </div>
    <div id="leaderboard-body" class="leaderboard-list"><p class="muted">Loading…</p></div>
  </div>
  <div id="bot-challenge-panel" hidden>
    <div class="bot-challenge-header">
      <button id="bot-challenge-back" class="ghost">← Back</button>
      <h2>🤖 Bots</h2>
    </div>
    <div id="bot-challenge-body" class="bot-challenge-body"><p class="muted">Loading…</p></div>
  </div>
  <p id="error" class="error" hidden></p>
  <main id="screen">
    <p class="muted">Connecting to the board…</p>
  </main>
  <div id="bot-add-panel" hidden>
    <button id="bot-add-trigger" class="ghost">Add Bot 🤖 to the open seat</button>
  </div>

  <!-- The 3D race (main.js), shown via body.in-race/body.race-ready. -->
  <div id="game-stage"></div>
  <!-- In-race HUD, built by game-viewport/hud/hud.ts. -->
  <div id="hud"></div>
  <!-- Shown by CSS between body.in-race and body.race-ready while assets load. -->
  <div id="loading-overlay">
    <div class="loading-spinner"></div>
    <p>Loading track…</p>
  </div>

  <script type="module" src="duel-app.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
