<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>007 — Duel</title>
    <link rel="stylesheet" href="/node_modules/duel-game-core/style.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>007 <span class="sub">— Duel</span></h1>
      <div class="session">
        <span class="label">Agent ID</span>
        <code id="sid">…</code>
        <button id="new-sid" title="Play as a different agent">new</button>
      </div>
    </header>

    <p id="error" class="error" hidden></p>

    <main id="screen">
      <p class="muted">Connecting to the board…</p>
    </main>

    <footer>
      <p class="muted">
        Your Agent ID is per browser tab — open a second tab to play the
        other seat. An idle board can be taken over after 60&nbsp;seconds.
      </p>
    </footer>

    <!--
      Bare-specifier resolution for duel-game-core/ws/gateway-*.js's own
      dependencies (see ../../../frontend/README.md's "Real-time push"
      section / ../../../CLAUDE.md rule 10) — the browser has no
      node_modules resolution of its own, so these three need mapping
      the same way app.js loads @dfinity/agent from a full esm.sh URL
      directly (that one's a bare specifier deep inside a COPIED
      node_modules/duel-game-core file, so it can't use the same
      full-URL trick app.js does).

      INLINE ON PURPOSE, and the CSP knows it by content hash, not
      'unsafe-inline': .ic-assets.json5's script-src has no
      'unsafe-inline' (that would allow ANY inline script, not just this
      one — a real weakening of the policy), and `src="..."` on an
      external import map was tried and does NOT work in practice (a live
      `import("cborg")` still failed to resolve after load with a
      `src`-based importmap.json in place) — so a CSP hash allow-listing
      this exact inline script is the only option that keeps the policy
      otherwise strict. If you edit the JSON below, recompute the hash in
      .ic-assets.json5's `Content-Security-Policy` header or every game
      screen breaks silently (stuck on "Connecting to the board…", the
      only symptom is a swallowed
      `TypeError: Failed to resolve module specifier "cborg"` in the
      console):

        python3 -c "
        import hashlib, base64, re
        html = open('index.html').read()
        m = re.search(r'<script type=\"importmap\">(.*?)</script>', html, re.S)
        print('sha256-' + base64.b64encode(hashlib.sha256(m.group(1).encode()).digest()).decode())
        "
    -->
    <script type="importmap">
      {
        "imports": {
          "@icp-sdk/core/candid": "https://esm.sh/@icp-sdk/core@6.1.0/candid",
          "@icp-sdk/core/principal": "https://esm.sh/@icp-sdk/core@6.1.0/principal",
          "cborg": "https://esm.sh/cborg@4.5.8"
        }
      }
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
