<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chopsticks</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="text-2xl" role="img" aria-label="hand">✋</span>
        <h1>Chopsticks</h1>
      </div>
      <div class="header-controls">
        <div class="playing-as">
          <span class="lbl">Playing as</span>
          <code id="sid" class="who">…</code>
          <button type="button" id="new-sid" class="switch" aria-label="Switch player">switch</button>
          <button type="button" id="duel-auth-btn" class="switch" hidden></button>
        </div>
        <button type="button" id="leaderboard-toggle" class="header-pill primary" aria-label="Leaderboard">
          <span aria-hidden="true">🏆</span><span class="wide-only">Leaderboard</span>
        </button>
        <button type="button" id="tutorial-toggle" class="header-pill accent" aria-label="How to play">
          <span aria-hidden="true">?</span><span class="wide-only">How to Play</span>
        </button>
      </div>
    </header>

    <main id="screen">
      <div class="panel center"><h2 class="faint">Loading game…</h2></div>
    </main>

    <div id="overlay"></div>

    <p id="alert" class="alert" hidden></p>

    <footer class="app-footer">
      <p>
        © 2026. Built with love using
        <a href="https://github.com/research-ag/duel-core" target="_blank" rel="noopener noreferrer">duel-game-core</a>.
        Your Player ID is per browser tab unless you log in. An idle game can be taken over after 90&nbsp;seconds.
      </p>
    </footer>

    <dialog id="confirm-forfeit">
      <form method="dialog">
        <p>Forfeit this game? Your opponent takes the win.</p>
        <div class="row">
          <button class="btn-action outline" value="no">Stay</button>
          <button class="btn-action secondary" value="yes">Forfeit</button>
        </div>
      </form>
    </dialog>

    <dialog id="enter-code">
      <form method="dialog">
        <p>This table is protected. Enter its access code.</p>
        <input type="text" placeholder="access code" autocomplete="off" />
        <div class="row">
          <button type="button" class="btn-action outline" value="cancel">Cancel</button>
          <button class="btn-action primary" value="join">Join</button>
        </div>
      </form>
    </dialog>

    <!-- esbuild's bundle of src/app.js (see ../build.js). -->
    <script type="module" src="/app.js"></script>
  </body>
</html>
