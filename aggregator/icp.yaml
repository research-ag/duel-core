# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v0.1.0-beta.2/docs/schemas/icp-yaml-schema.json

canisters:
  - name: backend
    recipe:
      type: "@dfinity/motoko@v4.1.0"
      configuration:
        main: src/Main.mo
  - name: frontend
    recipe:
      type: "@dfinity/asset-canister@v2.3.0"
      configuration:
        # `npm run build` (from frontend/) must run first — see
        # CLAUDE.md's "Build & test" section. dist/ is esbuild's bundled
        # output, not checked in.
        dir: frontend/dist
