[package]
name = "duel-game-core"
version = "0.1.0"
description = "Rules-agnostic 2-player session engine for Internet Computer games: tables, lobby, rematch, bots, leaderboard"
repository = "https://github.com/research-ag/duel-core"
license = "Apache-2.0"
files = [ "src/**/*.mo" ]

[dependencies]
core = "2.7.0"
promtracker = "1.0.2"
prng = "0.2.0"

[requirements]
moc = "2.0.0"

[optimize]

[toolchain]
moc = "2.2.4"
pocket-ic = "15.0.0"
wasm-opt = "133"

[dev-dependencies]
bench-helper = "0.0.4"
